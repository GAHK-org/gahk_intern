version: '3'

# Dev task runner for the GAHK Django rewrite.
#   task dev       -> the whole app in Docker, including Celery worker + Beat -> http://127.0.0.1:8800
#   task dev:local -> the same thing, but Django runs directly on the host instead of in a container
#   task debug     -> dev:local's server under debugpy, waiting for your IDE to attach (port 5678)
#   task debug:pdb -> the same server, but breakpoint() drops into pdb in this terminal instead
# Postgres + SeaweedFS (S3) are used either way (see app/.env.example). `dev:local`/`debug` use the project virtualenv at ./.venv
# and the Django project in ./app; `dev` builds and runs Dockerfile.dev instead — see docker-compose.yml.

# Dependencies are managed by uv (pyproject.toml + uv.lock). `uv run` auto-syncs the ./.venv and runs
# in it; every Python task sets `dir: app`, and uv discovers the project by walking up to the repo root.
# Run `task install` (uv sync) once to create the environment.
vars:
  PY: 'uv run python'
  APP: '{{.ROOT_DIR}}/app'
  # Dev server address for `dev:local`/`debug` (`dev`, the Docker one, always binds 127.0.0.1:8800 —
  # see docker-compose.yml). 8000/8001/8080 are often taken by VS Code; override with:
  #   task dev:local DEV_ADDR=127.0.0.1:9000
  DEV_ADDR: '127.0.0.1:8800'
  # uvicorn, as in production (Dockerfile), at DEV_ADDR. No lifespan: Django's ASGI handler has none.
  SERVE: 'uvicorn config.asgi:application --host {{splitList ":" .DEV_ADDR | first}} --port {{splitList ":" .DEV_ADDR | last}} --lifespan off'
  # Where debugpy listens for the IDE. Override the same way as DEV_ADDR if 5678 is taken.
  DEBUG_ADDR: '127.0.0.1:5678'
  # `task debug` blocks until the IDE attaches, so a breakpoint in startup code or in the first
  # request cannot be missed. To start serving immediately and attach whenever: task debug DEBUG_WAIT=
  DEBUG_WAIT: '--wait-for-client'
  # The photo album's local copy of thumbnails and HD images (photo_album.cache), so the dev servers
  # serve them the way production does instead of redirecting to S3. Set per server task rather than
  # in `env:` below so the tests keep exercising the redirect path. Gitignored; delete it to empty it.
  PHOTO_ALBUM_CACHE_DIR: '{{.ROOT_DIR}}/app/cache'

env:
  DJANGO_DEBUG: '1'
  # Windows consoles default to cp1252, which cannot encode the non-ASCII characters our management
  # commands print (the ølkælder summaries, for one). Without this the
  # command dies with UnicodeEncodeError *after* doing its work, which reads like a data failure.
  PYTHONIOENCODING: 'utf-8'

tasks:
  default:
    desc: List available tasks
    cmds: ['task --list']
    silent: true

  install:
    desc: Create/sync the virtualenv from pyproject.toml + uv.lock (runtime + dev deps)
    cmds: ['uv sync']

  dev:local:
    desc: Start Postgres+S3, Celery worker + Beat, then run Django directly on the host (http://127.0.0.1:8800)
    dir: '{{.APP}}'
    env:
      PHOTO_ALBUM_CACHE_DIR: '{{.PHOTO_ALBUM_CACHE_DIR}}'
    cmds:
      - task: services:up
      - task: frontend:build
      - '{{.PY}} manage.py migrate'
      - '{{.PY}} -m {{.SERVE}} --reload'

  debug:
    desc: 'Like dev:local, but under debugpy, waiting for the IDE to attach ("Attach to task debug")'
    dir: '{{.APP}}'
    env:
      PHOTO_ALBUM_CACHE_DIR: '{{.PHOTO_ALBUM_CACHE_DIR}}'
      # So a breakpoint() left in the code stops in the IDE rather than dropping this terminal into
      # pdb, which fights the attached debugger for stdin. task debug:pdb is the other way round.
      PYTHONBREAKPOINT: debugpy.breakpoint
    cmds:
      - task: services:up
      - '{{.PY}} manage.py check'
      # debugpy prints NOTHING while it waits, so without this line the task looks like it hung.
      # It has not: the server does not start until the IDE connects. Said out loud because the
      # silence is the single most confusing thing about this task.
      - cmd: |
          printf '\n  debugpy is listening on %s\n' '{{.DEBUG_ADDR}}'
          printf '  The server starts when your IDE attaches, and not before - so a quiet\n'
          printf '  terminal here is the task working, not the task hung.\n\n'
          printf '  VS Code: Run and Debug -> "Attach to task debug" (F5).\n'
          printf '  Start serving straight away instead:  task debug DEBUG_WAIT=\n\n'
        silent: true
      # No --reload, and that is REQUIRED, not a preference: the reloader runs the server in a child
      # process, so the debugger would attach to the parent and never see a breakpoint. Each request
      # runs on its own thread, so others carry on while you are paused in one.
      - '{{.PY}} -m debugpy --listen {{.DEBUG_ADDR}} {{.DEBUG_WAIT}} -m {{.SERVE}}'

  debug:pdb:
    desc: Like debug, but breakpoint() drops into pdb in this terminal instead of the IDE
    dir: '{{.APP}}'
    env:
      PHOTO_ALBUM_CACHE_DIR: '{{.PHOTO_ALBUM_CACHE_DIR}}'
      PYTHONBREAKPOINT: pdb.set_trace
    cmds:
      - task: services:up
      - '{{.PY}} manage.py check'
      - '{{.PY}} -m {{.SERVE}}'

  migrate:
    desc: Apply database migrations
    dir: '{{.APP}}'
    cmds: ['{{.PY}} manage.py migrate']

  makemigrations:
    desc: Create migrations from model changes
    dir: '{{.APP}}'
    cmds: ['{{.PY}} manage.py makemigrations']

  check:
    desc: Run Django system checks
    dir: '{{.APP}}'
    cmds: ['{{.PY}} manage.py check']

  shell:
    desc: Open the Django shell
    dir: '{{.APP}}'
    cmds: ['{{.PY}} manage.py shell']

  superuser:
    desc: Create an admin superuser
    dir: '{{.APP}}'
    cmds: ['{{.PY}} manage.py createsuperuser']

  seed:
    desc: Fill the DB with realistic fake data for dev/demo (wipes existing demo data; prints logins)
    dir: '{{.APP}}'
    cmds:
      - task: services:up
      - '{{.PY}} manage.py migrate'
      - '{{.PY}} manage.py seed_demo --fresh {{.CLI_ARGS}}'

  test:
    desc: Run the pytest suite
    dir: '{{.APP}}'
    cmds: ['{{.PY}} -m pytest {{.CLI_ARGS}}']

  # `task test` reads app/.env, which is tuned for real dev and so diverges from CI in two ways
  # that break the suite when run from the host:
  #   - DATABASE_URL points at the *in-Docker* Postgres hostname (only resolvable inside the network)
  #   - TURNSTILE_SECRET_KEY is set, so the admissions form tests hit real Cloudflare verification
  # These variants override both so the host run matches CI:
  #   test:pg     -> the compose Postgres via its host port (needs `task db:up`); matches CI exactly.
  #   test:sqlite -> a throwaway local SQLite file; no Docker needed, but misses Postgres-only behaviour.
  test:pg:
    desc: 'Run pytest against the local Postgres container (task db:up first); CI parity'
    dir: '{{.APP}}'
    env:
      DATABASE_URL: 'postgres://gahk:gahk@localhost:5432/gahk'
      TURNSTILE_SECRET_KEY: ''
    cmds: ['{{.PY}} -m pytest {{.CLI_ARGS}}']

  test:sqlite:
    desc: 'Run pytest against a throwaway local SQLite DB (no Docker needed)'
    dir: '{{.APP}}'
    env:
      DATABASE_URL: 'sqlite:///test-db.sqlite3'
      TURNSTILE_SECRET_KEY: ''
    cmds: ['{{.PY}} -m pytest {{.CLI_ARGS}}']

  lint:
    desc: Lint + format-check with ruff
    dir: '{{.APP}}'
    cmds: ['uv run ruff check .', 'uv run ruff format --check .']

  fix:
    desc: Auto-fix lint issues and format the code with ruff (the writing counterpart of `lint`)
    dir: '{{.APP}}'
    cmds: ['uv run ruff check --fix .', 'uv run ruff format .']

  typecheck:
    desc: Static type-check with mypy (+ django-stubs). Runs from the repo root (config in pyproject.toml).
    cmds: ['uv run mypy app']

  hooks:
    desc: Install the prek git pre-commit hooks (ruff + mypy run on commit)
    cmds: ['uv run prek install']

  db:up:
    desc: Start the Postgres container alone (use `services:up` for everyday dev)
    cmds: ['docker compose up -d postgres']

  db:down:
    desc: Stop the database containers
    cmds: ['docker compose down']

  db:psql:
    desc: psql shell on the target Postgres
    cmds: ['docker compose exec postgres psql -U gahk -d gahk']

  services:up:
     desc: Start Postgres, S3, Celery worker, and Beat
     cmds: ['docker compose --profile docker up -d postgres s3 s3-init worker beat']

  services:down:
     desc: Stop Postgres, S3, Celery worker, and Beat
     cmds: ['docker compose --profile docker stop postgres s3 s3-init worker beat']

  s3:up:
    desc: Start the local S3 (SeaweedFS) alone (S3-compatible object storage standing in for Hetzner locally)
    cmds: ['docker compose up -d s3 s3-init']

  s3:down:
    desc: Stop the local S3
    cmds: ['docker compose stop s3 s3-init']

  s3:console:
    desc: Print the local S3 file-browser URL (SeaweedFS filer UI)
    cmds:
      - 'echo "http://localhost:8888/buckets/  (no login; S3 API on :9000, key: gahkdev / secret: gahkdevsecret)"'
    silent: true

  dev:
    desc: Run the whole app in Docker with hot-reload and Celery worker + Beat -> http://127.0.0.1:8800
    # Foreground, attached to the web and background-process output (not postgres/s3's). Ctrl-C
    # stops them, same as dev:local's server. `dev:logs`/`dev:down` manage a detached start.
    deps: [frontend:build]
    cmds: ['docker compose --profile docker up --build --attach web --attach worker --attach beat web worker beat']

  dev:down:
    desc: Stop the Docker app and Celery processes (Postgres/S3 keep running; `services:down` stops those too)
    cmds: ['docker compose --profile docker stop web worker beat']

  dev:local:down:
    desc: Stop the Docker Celery processes used by dev:local (Postgres/S3 keep running)
    cmds: ['docker compose --profile docker stop worker beat']

  dev:logs:
    desc: Follow logs from the Docker app and Celery processes
    cmds: ['docker compose logs -f web worker beat']

  frontend:install:
    desc: Install frontend dependencies (npm)
    dir: '{{.ROOT_DIR}}/frontend'
    cmds: ['npm install']

  frontend:build:
    desc: Build the Tailwind + TS bundle (Vite) into app/static/dist
    dir: '{{.ROOT_DIR}}/frontend'
    cmds: ['npm install --no-audit --no-fund --silent', 'npm run build']

  frontend:watch:
    desc: Rebuild the bundle on change (run alongside `task dev`/`dev:local` during frontend work)
    dir: '{{.ROOT_DIR}}/frontend'
    cmds: ['npm run watch']

  build:
    desc: Production build - frontend bundle + collectstatic (hashed/compressed)
    dir: '{{.APP}}'
    env:
      DJANGO_DEBUG: '0'
    cmds:
      - task: frontend:build
      - '{{.PY}} manage.py collectstatic --noinput'
