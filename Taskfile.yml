version: '3'

# Dev task runner for the GAHK Django rewrite.
#   task dev    -> migrate + run the server at http://127.0.0.1:8000
#   task debug  -> run the server under debugpy and wait for your IDE to attach (port 5678)
#   task debug:pdb -> the same server, but breakpoint() drops into pdb in this terminal instead
# Uses the project virtualenv at ./.venv and the Django project in ./app. Local dev uses SQLite
# unless DATABASE_URL is set (see app/.env.example); the Docker DBs (task db:up) are for ETL/Postgres.

# Dependencies are managed by uv (pyproject.toml + uv.lock). `uv run` auto-syncs the ./.venv and runs
# in it; every Python task sets `dir: app`, and uv discovers the project by walking up to the repo root.
# Run `task install` (uv sync) once to create the environment.
vars:
  PY: 'uv run python'
  APP: '{{.ROOT_DIR}}/app'
  # Dev server address. 8000/8001/8080 are often taken by VS Code; override with:
  #   task dev DEV_ADDR=127.0.0.1:9000
  DEV_ADDR: '127.0.0.1:8800'
  # Where debugpy listens for the IDE. Override the same way as DEV_ADDR if 5678 is taken.
  DEBUG_ADDR: '127.0.0.1:5678'
  # `task debug` blocks until the IDE attaches, so a breakpoint in startup code or in the first
  # request cannot be missed. To start serving immediately and attach whenever: task debug DEBUG_WAIT=
  DEBUG_WAIT: '--wait-for-client'

env:
  DJANGO_DEBUG: '1'
  # Windows consoles default to cp1252, which cannot encode the non-ASCII characters our management
  # commands print (etl_verify's "clean ≤ legacy" notes, the ølkælder summaries). Without this the
  # command dies with UnicodeEncodeError *after* doing its work, which reads like a data failure.
  PYTHONIOENCODING: 'utf-8'

tasks:
  default:
    desc: List available tasks
    cmds: ['task --list']
    silent: true

  install:
    desc: Create/sync the virtualenv from pyproject.toml + uv.lock (runtime + dev deps)
    cmds: ['uv sync']

  dev:
    desc: Build assets, migrate, then run the dev server (http://127.0.0.1:8800)
    dir: '{{.APP}}'
    cmds:
      - task: frontend:build
      - '{{.PY}} manage.py migrate'
      - '{{.PY}} manage.py runserver {{.DEV_ADDR}}'

  debug:
    desc: 'Run the dev server under debugpy and wait for the IDE to attach (VS Code: "Attach to task debug")'
    dir: '{{.APP}}'
    env:
      # So a breakpoint() left in the code stops in the IDE rather than dropping this terminal into
      # pdb, which fights the attached debugger for stdin. task debug:pdb is the other way round.
      PYTHONBREAKPOINT: debugpy.breakpoint
    cmds:
      # debugpy prints NOTHING while it waits, so without this line the task looks like it hung.
      # It has not: the server does not start until the IDE connects. Said out loud because the
      # silence is the single most confusing thing about this task.
      - cmd: |
          printf '\n  debugpy is listening on %s\n' '{{.DEBUG_ADDR}}'
          printf '  The server starts when your IDE attaches, and not before - so a quiet\n'
          printf '  terminal here is the task working, not the task hung.\n\n'
          printf '  VS Code: Run and Debug -> "Attach to task debug" (F5).\n'
          printf '  Start serving straight away instead:  task debug DEBUG_WAIT=\n\n'
        silent: true
      # --noreload is REQUIRED, not a preference: the reloader runs the server in a child process,
      # so the debugger would attach to the parent and never see a breakpoint. --nothreading keeps
      # the whole server stopped while you are paused, instead of other requests running on past
      # you; drop it if you are debugging something that needs concurrent requests.
      - '{{.PY}} -m debugpy --listen {{.DEBUG_ADDR}} {{.DEBUG_WAIT}} manage.py runserver --nothreading --noreload {{.DEV_ADDR}}'

  debug:pdb:
    desc: Run the dev server with breakpoint() dropping into pdb in this terminal (no IDE)
    dir: '{{.APP}}'
    env:
      PYTHONBREAKPOINT: pdb.set_trace
    cmds:
      - '{{.PY}} manage.py runserver --nothreading --noreload {{.DEV_ADDR}}'

  migrate:
    desc: Apply database migrations
    dir: '{{.APP}}'
    cmds: ['{{.PY}} manage.py migrate']

  makemigrations:
    desc: Create migrations from model changes
    dir: '{{.APP}}'
    cmds: ['{{.PY}} manage.py makemigrations']

  check:
    desc: Run Django system checks
    dir: '{{.APP}}'
    cmds: ['{{.PY}} manage.py check']

  shell:
    desc: Open the Django shell
    dir: '{{.APP}}'
    cmds: ['{{.PY}} manage.py shell']

  superuser:
    desc: Create an admin superuser
    dir: '{{.APP}}'
    cmds: ['{{.PY}} manage.py createsuperuser']

  seed:
    desc: Fill the DB with realistic fake data for dev/demo (wipes existing demo data; prints logins)
    dir: '{{.APP}}'
    cmds:
      - '{{.PY}} manage.py migrate'
      - '{{.PY}} manage.py seed_demo --fresh {{.CLI_ARGS}}'

  test:
    desc: Run the pytest suite
    dir: '{{.APP}}'
    cmds: ['{{.PY}} -m pytest {{.CLI_ARGS}}']

  # `task test` reads app/.env, which is tuned for real dev/ETL and so diverges from CI in two ways
  # that break the suite when run from the host:
  #   - DATABASE_URL points at the *in-Docker* Postgres hostname (only resolvable inside the network)
  #   - TURNSTILE_SECRET_KEY is set, so the admissions form tests hit real Cloudflare verification
  # These variants override both so the host run matches CI:
  #   test:pg     -> the compose Postgres via its host port (needs `task db:up`); matches CI exactly.
  #   test:sqlite -> a throwaway local SQLite file; no Docker needed, but misses Postgres-only behaviour.
  test:pg:
    desc: 'Run pytest against the local Postgres container (task db:up first); CI parity'
    dir: '{{.APP}}'
    env:
      DATABASE_URL: 'postgres://gahk:gahk@localhost:5432/gahk'
      TURNSTILE_SECRET_KEY: ''
    cmds: ['{{.PY}} -m pytest {{.CLI_ARGS}}']

  test:sqlite:
    desc: 'Run pytest against a throwaway local SQLite DB (no Docker needed)'
    dir: '{{.APP}}'
    env:
      DATABASE_URL: 'sqlite:///test-db.sqlite3'
      TURNSTILE_SECRET_KEY: ''
    cmds: ['{{.PY}} -m pytest {{.CLI_ARGS}}']

  lint:
    desc: Lint + format-check with ruff
    dir: '{{.APP}}'
    cmds: ['uv run ruff check .', 'uv run ruff format --check .']

  typecheck:
    desc: Static type-check with mypy (+ django-stubs). Runs from the repo root (config in pyproject.toml).
    cmds: ['uv run mypy app']

  hooks:
    desc: Install the prek git pre-commit hooks (ruff + mypy run on commit)
    cmds: ['uv run prek install']

  etl:verify:
    desc: Diff legacy MariaDB counts vs migrated Postgres counts
    dir: '{{.APP}}'
    cmds: ['{{.PY}} manage.py etl_verify']

  db:up:
    desc: Start the Postgres + MariaDB containers
    cmds: ['docker compose up -d postgres mariadb']

  db:down:
    desc: Stop the database containers
    cmds: ['docker compose down']

  db:psql:
    desc: psql shell on the target Postgres
    cmds: ['docker compose exec postgres psql -U gahk -d gahk']

  db:mysql:
    desc: mysql shell on the legacy MariaDB staging DB
    cmds: ['docker compose exec mariadb mariadb -ugahk -pgahk gahk_dk']

  etl:
    desc: 'Run the full legacy->clean data migration (needs task db:up + dump loaded)'
    dir: '{{.APP}}'
    cmds:
      - '{{.PY}} manage.py seed_rooms'
      - '{{.PY}} manage.py etl_residents'
      - '{{.PY}} manage.py etl_admissions'
      - '{{.PY}} manage.py etl_cms'
      - '{{.PY}} manage.py etl_ak'
      - '{{.PY}} manage.py etl_rooms'
      - '{{.PY}} manage.py etl_oelkaelder'
      - '{{.PY}} manage.py etl_stats'
      - '{{.PY}} manage.py reset_sequences'
      - '{{.PY}} manage.py sync_cms_media'

  frontend:install:
    desc: Install frontend dependencies (npm)
    dir: '{{.ROOT_DIR}}/frontend'
    cmds: ['npm install']

  frontend:build:
    desc: Build the Tailwind + TS bundle (Vite) into app/static/dist
    dir: '{{.ROOT_DIR}}/frontend'
    cmds: ['npm install --no-audit --no-fund --silent', 'npm run build']

  frontend:watch:
    desc: Rebuild the bundle on change (run alongside `task dev` during frontend work)
    dir: '{{.ROOT_DIR}}/frontend'
    cmds: ['npm run watch']

  build:
    desc: Production build - frontend bundle + collectstatic (hashed/compressed)
    dir: '{{.APP}}'
    env:
      DJANGO_DEBUG: '0'
    cmds:
      - task: frontend:build
      - '{{.PY}} manage.py collectstatic --noinput'
