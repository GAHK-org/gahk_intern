[project]
name = "ny-ny-intern"
version = "0.1.0"
description = "GAHK.dk rewrite - Django site for G. A. Hagemanns Kollegium"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "dj-database-url>=2.1",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "whitenoise>=6.6",
    "gunicorn>=22.0",
    "pymysql>=1.1", # ETL source reader (legacy MariaDB); harmless in prod
    "openpyxl>=3.1", # alumneliste Excel (.xlsx) export
    # >=0.3 is required, not cosmetic: core.markdown uses nh3.clean(attribute_filter=...), which
    # older 0.2 wheels do not accept — and a fresh resolve on one would TypeError at import in
    # production only, where DEBUG is off and the traceback is least visible.
    "nh3>=0.3", # HTML sanitization of admin-edited CMS content and resident-authored markdown
    "markdown-it-py>=4.0", # Markdown for resident-authored opslag; raw HTML off at the parser
    "pywebpush>=2.4",        # Web Push (VAPID + payload encryption) for Den Hurtige + opslagstavlen
    # Object storage for MEDIA_ROOT (Hetzner Object Storage, S3-compatible). The [s3] extra pulls
    # boto3. >=1.14 is required, not cosmetic: it is the release that reads per-backend OPTIONS out
    # of STORAGES, which is the only configuration style this project uses — on 1.13 every OPTIONS
    # key is silently ignored and the backend falls back to unauthenticated defaults.
    "django-storages[s3]>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "faker>=30.0", # fake data for the seed_demo dev fixture command
    # DEV ONLY, and deliberately so: events/icalendar.py hand-rolls RFC 5545 output, and one test
    # parses it back with an independent implementation. pip-audit runs against the production
    # lockfile (--no-dev), so a parser used purely as a test oracle costs nothing in that job.
    "icalendar>=6.0", # independent parser, used only to check our own .ics output
    "mypy>=2.1.0",
    "django-stubs[compatible-mypy]>=6.0.9",
    "prek>=0.4.9",
    # DEV ONLY, and deliberately so, exactly like the icalendar entry above. Live Arkiv uploads make
    # their own preview in the browser (frontend/src/imageupload.ts), so production has no image
    # library and needs none. This exists for `manage.py make_arkiv_thumbnails`, the one-off that
    # gives the imported Dropbox backlog previews nobody is going to re-upload by hand. pip-audit
    # runs against the production lockfile (--no-dev), so it costs prod nothing.
    "pillow>=11.0",
]

# This is an application, not a distributable package: uv manages the venv + deps but does not build/
# install the project itself (no build backend needed). The Django code lives in ./app.
[tool.uv]
package = false

# Type checking. Run from the repo root as `mypy app` (see `task typecheck`); django-stubs resolves the
# ORM's dynamic attributes so annotations added for ANN are actually verified. Migrations (generated)
# and tests are excluded. Pragmatic baseline — tighten (disallow_untyped_defs, strict) incrementally.
[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
mypy_path = "app"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = '(^|/)(migrations|tests)/'

[tool.django-stubs]
django_settings_module = "config.settings"
