{% extends "auth_base.html" %}
{% block title %}Vælg nyt kodeord - GAHK Intern{% endblock %}
{% block content %}
  {% if validlink %}
    <h1>Vælg nyt kodeord</h1>
    <div class="card max-w-md">
      <form method="post">{% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Gem kodeord</button>
      </form>
    </div>
  {% else %}
    <h1>Linket er ugyldigt</h1>
    <p>Linket er udløbet eller allerede brugt. <a href="{% url 'password_reset' %}">Bed om et nyt</a>.</p>
  {% endif %}
{% endblock %}
