{% extends "auth_base.html" %}
{% block title %}Glemt kodeord - GAHK Intern{% endblock %}
{% block content %}
  <h1>Glemt kodeord</h1>
  <div class="card max-w-md">
    <p class="mb-2">Indtast din e-mail, så sender vi et link til at vælge et nyt kodeord (udløber om 2 timer).</p>
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Send link</button>
    </form>
  </div>
{% endblock %}
