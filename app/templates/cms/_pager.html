{% if page_obj.has_other_pages %}
  <nav class="pager" aria-label="Sider">
    {% if page_obj.has_previous %}<a class="btn btn-secondary" href="?{% if pager_query %}{{ pager_query }}&amp;{% endif %}side={{ page_obj.previous_page_number }}">← Nyere</a>{% endif %}
    <span class="muted text-sm">Side {{ page_obj.number }} af {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="btn btn-secondary" href="?{% if pager_query %}{{ pager_query }}&amp;{% endif %}side={{ page_obj.next_page_number }}">Ældre →</a>{% endif %}
  </nav>
{% endif %}
