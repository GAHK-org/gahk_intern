<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ document.title }}</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    #onlyoffice-editor, #onlyoffice-editor iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div id="onlyoffice-editor"></div>
  {{ editor_config|json_script:"onlyoffice-config" }}
  <script src="{{ onlyoffice_public_url }}/web-apps/apps/api/documents/api.js"></script>
  <script>
    const configuration = JSON.parse(document.getElementById("onlyoffice-config").textContent);
    new DocsAPI.DocEditor("onlyoffice-editor", configuration);
    const frame = document.querySelector("body > iframe");
    frame.style.width = "100%";
    frame.style.height = "100%";
    frame.style.border = "0";
  </script>
</body>
</html>
