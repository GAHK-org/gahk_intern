{% extends "base.html" %}
{% block content %}<h1>{{ title }}</h1><form method="post">{% csrf_token %}<p data-album-folder-selector data-current-value="{{ form.folder.value|default:'Andet' }}"><label for="folder-choice">Vælg mappe</label><select id="folder-choice" data-album-folder-choice>{% for folder in folder_options %}<option value="{{ folder }}">{{ folder }}</option>{% endfor %}<option value="__new__">Ny mappe...</option></select><label for="id_folder">Eller skriv en ny mappe</label><input id="id_folder" name="folder" type="text" maxlength="10" required value="{{ form.folder.value|default:'Andet' }}" data-album-folder-input></p>{% for error in form.folder.errors %}<p>{{ error }}</p>{% endfor %}<p><label for="{{ form.name.id_for_label }}">{{ form.name.label }}</label>{{ form.name }}</p>{% for error in form.name.errors %}<p>{{ error }}</p>{% endfor %}<button>Gem</button></form>{% endblock %}
