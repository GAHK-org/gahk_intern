{% comment %} The upload widget, for new videos (several at once, up to `upload_config.maxFiles`) and for a new version of one (`upload_config.video`). {% endcomment %}
<div class="flix-panel" data-flix-upload>
  {{ upload_config|json_script:"flix-upload-config" }}
  <label class="flix-dropzone" data-flix-drop>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    <strong>{% if upload_config.video %}Vælg den nye version{% else %}Vælg videoer, eller træk dem herind{% endif %}</strong>
    <span class="muted">MP4, MOV, M4V, WebM, AVI, MKV, 3GP, MTS, MPEG, WMV eller OGV · op til {{ max_gb|floatformat:"-1" }} GB</span>
    {% if not upload_config.video %}<span class="muted">Flere på én gang, hvis du vil: de sendes én ad gangen{% if upload_config.maxFiles < upload_config.maxDrafts %}, og du har plads til {{ upload_config.maxFiles }} kladde{{ upload_config.maxFiles|pluralize:"r" }} mere{% endif %}.</span>{% endif %}
    <input type="file" accept="video/*,.mp4,.m4v,.mov,.webm,.avi,.mkv,.3gp,.3g2,.mts,.m2ts,.mpg,.mpeg,.wmv,.ogv" hidden data-flix-file{% if upload_config.maxFiles > 1 %} multiple{% endif %}>
  </label>
  {# One row per file, filled in by gahkflix.ts (initUpload). #}
  <ol class="flix-upload-queue" data-flix-queue hidden></ol>
  <p class="flix-upload-status" role="status" data-flix-upload-status></p>
</div>
