{% extends "gahkflix/base.html" %}
{% load static %}
{% block title %}{{ video.title }} – GAHKFlix{% endblock %}
{% block body_class %}flix-play{% endblock %}
{% block header %}{% endblock %}
{% block footer %}{% endblock %}
{% block content %}
  {% comment %}
    ONE <video> element for the intro and the film. The GAHKFlix intro plays first, then the same
    element is pointed at the film: a phone that only lets a page play sound after a tap (iOS) lets
    an element it has already played go on playing, which a second element would not get.
  {% endcomment %}
  <div class="flix-player" data-flix-player>
    {{ player|json_script:"flix-player-config" }}
    <video playsinline preload="auto" data-intro="{% static 'gahkflix/intro.mp4' %}" data-start="{{ start_at|floatformat:'1u' }}"></video>
    <div class="flix-player-top">
      <a class="flix-back" href="{% url 'gahkflix:detail' video.pk %}" aria-label="Tilbage" data-flix-back>←</a>
      <h1>{% if video.series %}{{ video.series.title }}{% if video.episode_label %} · {{ video.episode_label }}{% endif %}<small>{{ video.title }}</small>{% else %}{{ video.title }}{% endif %}</h1>
    </div>
    {% if qualities|length > 1 %}
      <div class="flix-quality" role="group" aria-label="Kvalitet" data-flix-quality hidden>
        {% for quality in qualities %}<button type="button" data-quality="{{ quality }}" aria-pressed="false">{% if quality == "fullhd" %}Full HD{% else %}HD{% endif %}</button>{% endfor %}
      </div>
    {% endif %}
    <button class="flix-skip" type="button" data-flix-skip hidden>Spring intro over</button>
    {% if next_episode %}
      <a class="flix-next" href="{% url 'gahkflix:play' next_episode.pk %}" data-flix-next hidden>Næste afsnit ▸</a>
    {% endif %}
    <button class="flix-start" type="button" aria-label="Afspil" data-flix-start hidden><span>▶</span></button>
    <p class="flix-player-error" role="alert" data-flix-error hidden></p>
  </div>
{% endblock %}
