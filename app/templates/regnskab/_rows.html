{% load oel_extras %}
{% for row in rows %}
  <tr style="border-bottom:1px solid #f0f1f4">
    <td>
      {{ row.resident.full_name }}
      <br><span class="muted text-xs">{{ row.resident.email }}</span>
    </td>
    <td class="whitespace-nowrap">{% if row.room %}{{ row.room|stringformat:"03d" }}{% else %}-{% endif %}</td>
    <td class="whitespace-nowrap {% if row.ak_krydser < 0 %}text-red-600 font-semibold{% endif %}">
      {{ row.ak_krydser }} krydser
    </td>
    <td class="whitespace-nowrap {% if row.oek_ore < 0 %}text-red-600 font-semibold{% endif %}">
      {{ row.oek_ore|kr }}
    </td>
    <td class="whitespace-nowrap">
      <form method="post" action="{% url 'set_economic_account_number' row.resident.pk %}"
            class="flex items-center gap-1">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <input type="number" name="economic_account_number" min="1" style="width:5rem"
               value="{{ row.resident.economic_account_number|default_if_none:'' }}" placeholder="–">
        <button type="submit" class="btn">Gem</button>
      </form>
    </td>
  </tr>
{% empty %}
  <tr><td colspan="5" class="muted">Ingen.</td></tr>
{% endfor %}
