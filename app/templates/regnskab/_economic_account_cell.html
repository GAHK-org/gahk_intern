{% comment %}
  One resident's e-conomic kontonr. and a link to the page where regnskab changes it
  (regnskab:edit_economic_account_number) — never edited inline, so a stray click changes nothing.
{% endcomment %}
    <td class="whitespace-nowrap">
      {{ resident.economic_account_number|default:"–" }}
      <a class="btn" href="{% url 'regnskab:edit_economic_account_number' resident.pk %}?next={{ request.get_full_path|urlencode }}">Rediger</a>
    </td>
