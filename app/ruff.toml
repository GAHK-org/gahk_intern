line-length = 110
target-version = "py312"

[lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "DTZ", "PIE", "RET", "FURB", "ICN", "ISC", "TID", "PGH", "RUF",
    "S", "DJ", "PTH", "PL", "Q", "ANN",
]
ignore = [
    "E501",     # long lines tolerated (comments/URLs)
    "RUF012",   # mutable class defaults: Django Meta/field churn, wants ClassVar everywhere
    "RUF001",   # ambiguous unicode in strings: false positives on Danish text (æ/ø/å, en-dash)
    "RUF002",   # ambiguous unicode in docstrings: same
    "RUF003",   # ambiguous unicode in comments: same
    "DJ008",    # __str__ on every model: noise on ledger/child tables (Deposit, shares, …)
    # pylint (PL) — keep the error/warning checks, drop the opinionated/noisy refactor metrics:
    "PLR2004",  # magic-value-comparison: too noisy (every == 200 / == 2)
    "PLC0415",  # import-outside-top-level: we import lazily on purpose (Faker, optional deps)
    "PLW2901",  # redefined-loop-name: flags the idiomatic `x = normalize(x)` in-loop pattern
    "PLR0911", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0916", "PLR0917",  # complexity metrics
]

[lint.per-file-ignores]
"*/migrations/*" = ["E", "F", "UP", "B", "C4", "DTZ", "PIE", "RET", "FURB", "RUF", "S", "DJ", "PTH", "PL", "Q", "TID251"]
"tests/*" = ["B", "F811", "DTZ", "S", "TID251"]  # tests use assert + literal demo passwords (S101/S105/S106/S107)
# The only places allowed raw SQL (TID251 below): operator tooling over Celery's and the broker's own
# tables, never a domain's — and code that needs the connection object itself rather than SQL (a
# thread closing its own connection, asking whether a transaction is open). A new entry here is a
# design decision — say why in the PR.
"core/tasks.py" = ["TID251"]                      # broker/result-table maintenance
"core/push.py" = ["TID251"]                       # closes the thread's connection, no SQL
"core/health.py" = ["TID251"]                     # /health's SELECT 1, no table at all
"core/heartbeat.py" = ["TID251"]                  # closes the heartbeat thread's connection, no SQL
"photo_album/progress.py" = ["TID251"]            # transaction check + own thread's connection, no SQL
"core/management/commands/*" = ["TID251"]         # reset_sequences and other operator commands
"residents/views_admin.py" = ["TID251"]           # worker-jobs console reads celery_taskmeta

# Raw SQL names tables, and a table name is another domain's internals with no import for Tach to
# see. Inside a domain, use the ORM; across domains, use the other domain's api.py. See
# docs/domain-boundaries.md. (Catches the imports; `.raw()`/`.extra()` on a manager are review rules.)
[lint.flake8-tidy-imports.banned-api]
"django.db.connection".msg = "Raw SQL bypasses domain boundaries; use the ORM, or another domain's api.py."
"django.db.connections".msg = "Raw SQL bypasses domain boundaries; use the ORM, or another domain's api.py."
"django.db.models.RawSQL".msg = "Raw SQL bypasses domain boundaries; use the ORM, or another domain's api.py."
"django.db.models.expressions.RawSQL".msg = "Raw SQL bypasses domain boundaries; use the ORM, or another domain's api.py."
