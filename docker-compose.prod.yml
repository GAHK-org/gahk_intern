# Production stack for Coolify (single Hetzner box). TLS/reverse-proxy is provided by Coolify/Traefik
# in front of `web`. PostgreSQL and MariaDB are separate **Coolify-managed resources** (not defined
# here) in the same Coolify project — set DATABASE_URL to the managed Postgres resource's *internal*
# URL. Env vars (DATABASE_URL, DJANGO_SECRET_KEY, ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, SMTP_*, …) are
# injected by Coolify's env manager, so there is no committed env_file. MediaWiki is its own app.
#
# The image is not built here: CI builds it and moves `:main` once the checks pass, and a timer on the
# server pulls it and asks Coolify to redeploy (DEPLOY.md §4a). All four services run the same one.
# IMAGE_TAG is for rolling back: set it to `sha-<commit>` in Coolify and redeploy; unset to follow main.
services:
  web:
    image: ghcr.io/gahk-org/gahk_intern:${IMAGE_TAG:-main}
    restart: unless-stopped
    command: >-
      sh -c "python manage.py migrate --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --lifespan off --timeout-keep-alive 120"
    environment:
      PHOTO_ALBUM_CACHE_DIR: /app/cache
    volumes:
      - media:/app/media       # uploaded files (room-inspection photos, relocated legacy images)
      # Local copies of photo-album thumbnails/HD images (photo_album.cache, ~5 GB at most). Only
      # a cache — deleting the volume costs a cold start, nothing else — but keeping it across
      # deploys means the grid does not refetch everything from S3 after each one.
      - photo-album-cache:/app/cache
    expose:
      - "8000"                 # reached by Coolify/Traefik over the internal network (not host-published)
    # Fails when the app stops answering or loses its database (core/health.py). Python, not curl:
    # the slim image has neither curl nor wget. start_period covers `migrate` on boot.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # `web` runs the migrations; the workers and beat WAIT for them rather than racing them. Without the gate,
  # every deploy that adds a migration starts `beat` against a database with no
  # django_celery_beat_periodictask and `worker` against one with no photo_album_albumdownload, and
  # both crash-loop until `web` catches up — recoverable, thanks to `restart`, but it means a wall
  # of tracebacks on each deploy and no way to tell a real breakage from the usual noise.
  #
  # `migrate --check` exits non-zero while anything is unapplied AND while the database is
  # unreachable, so one loop covers both. Neither service runs `migrate` itself: three containers
  # migrating the same database concurrently is its own failure.
  # Two workers (CELERY_TASK_ROUTES in config/settings.py). `worker` takes the default "celery"
  # queue — mail, sweeps, everything quick — so none of it waits behind a video encode, and
  # "thumbnails", photo derivatives, by turns with it: a mail waits for one thumbnail, not 400.
  # `worker-media` takes "media": encodes, album ZIP imports and downloads, the hash backfill — the
  # jobs that read whole files, one at a time, because two of them side by side with ffmpeg is what
  # ran this box out of memory.
  worker:
    image: ghcr.io/gahk-org/gahk_intern:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - web
    command: >-
      sh -c "until python manage.py migrate --check; do echo 'waiting for migrations'; sleep 3; done;
             celery -A config worker -Q celery,thumbnails -n default@%h --loglevel=INFO --concurrency=1"
    # The worker's own timer touches the file every 30 s (core/celery_health.py), also mid-job.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/celery-worker-alive') > 120)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s  # the wait for `web`'s migrations

  worker-media:
    image: ghcr.io/gahk-org/gahk_intern:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - web
    command: >-
      sh -c "until python manage.py migrate --check; do echo 'waiting for migrations'; sleep 3; done;
             celery -A config worker -Q media -n media@%h --loglevel=INFO --concurrency=1"
    # The worker's own timer touches the file every 30 s (core/celery_health.py), also mid-job.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/celery-worker-alive') > 120)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s  # the wait for `web`'s migrations

  beat:
    image: ghcr.io/gahk-org/gahk_intern:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - web
    command: >-
      sh -c "until python manage.py migrate --check; do echo 'waiting for migrations'; sleep 3; done;
             celery -A config beat --loglevel=INFO"
    # Fails when beat stops sending its once-a-minute heartbeat (core/management/commands/healthcheck.py).
    healthcheck:
      test: ["CMD", "python", "manage.py", "healthcheck", "beat"]
      interval: 120s
      timeout: 30s
      retries: 3
      start_period: 600s

volumes:
  media:
  photo-album-cache:
