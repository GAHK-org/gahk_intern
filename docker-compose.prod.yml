# Production stack for Coolify (single Hetzner box). TLS/reverse-proxy is provided by Coolify/Traefik
# in front of `web`. PostgreSQL and MariaDB are separate **Coolify-managed resources** (not defined
# here) in the same Coolify project — set DATABASE_URL to the managed Postgres resource's *internal*
# URL. Env vars (DATABASE_URL, DJANGO_SECRET_KEY, ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, SMTP_*, …) are
# injected by Coolify's env manager, so there is no committed env_file. MediaWiki is its own app.
#
# The image is not built here: CI builds it and moves `:main` once the checks pass, and a timer on the
# server asks Coolify to redeploy when it moves (DEPLOY.md §4a). All four services run the same one.
# Coolify pulls it before it stops the running containers (4.3.19 and later), so a redeploy by hand
# gets the current `:main` too, and an unreachable registry fails the deploy with the old one still up.
# IMAGE_TAG is for rolling back: set it to `sha-<commit>` in Coolify and redeploy; unset to follow main.
#
# MEMORY (DEPLOY.md §4g). The box has 4 GB, shared with Coolify, Postgres and MediaWiki. Each service
# has a limit, so a job that runs away is killed inside its own container instead of the kernel
# picking a victim on the whole box — which on 2026-11-15 sent Postgres into recovery and took the
# site down. memswap_limit equal to mem_limit keeps the containers out of the swap, which is there
# for everything else. The workers are also the kernel's first choice should the box still run
# short (oom_score_adj), and their Celery child is replaced after a job that left it over
# --max-memory-per-child (in KiB): Python keeps the peak of its biggest job otherwise.
# MALLOC_ARENA_MAX=2 stops glibc from keeping a memory arena per thread, which inflates the threaded
# processes (uvicorn's request threads, boto3's upload threads) without being used.
#
# `exec` makes the server itself the container's main process, so a stop reaches it as SIGTERM and
# it shuts down cleanly. Behind a bare `sh -c`, sh got the SIGTERM, ignored it, and Docker killed
# everything 10 seconds later: every stop or reboot ended in exit 137.
services:
  web:
    image: ghcr.io/gahk-org/gahk_intern:${IMAGE_TAG:-main}
    restart: unless-stopped
    command: >-
      sh -c "python manage.py migrate --noinput &&
             exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --lifespan off --timeout-keep-alive 120"
    # One process (DEPLOY.md §4) using about 300 MB.
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      PHOTO_ALBUM_CACHE_DIR: /app/cache
      MALLOC_ARENA_MAX: "2"
    volumes:
      - media:/app/media       # uploaded files (room-inspection photos, relocated legacy images)
      # Local copies of photo-album thumbnails/HD images (photo_album.cache, ~5 GB at most). Only
      # a cache — deleting the volume costs a cold start, nothing else — but keeping it across
      # deploys means the grid does not refetch everything from S3 after each one.
      - photo-album-cache:/app/cache
    expose:
      - "8000"                 # reached by Coolify/Traefik over the internal network (not host-published)
    # Liveness only (core/health.py): an unhealthy container gets no traffic from Traefik, so this
    # must not fail just because a worker is down — /health is the full check, for uptime monitors.
    # Python, not curl: the slim image has no curl. start_period covers the migrate before uvicorn.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # `web` runs the migrations; the workers and beat WAIT for them rather than racing them. Without the gate,
  # every deploy that adds a migration starts `beat` against a database with no
  # django_celery_beat_periodictask and `worker` against one with no photo_album_albumdownload, and
  # both crash-loop until `web` catches up — recoverable, thanks to `restart`, but it means a wall
  # of tracebacks on each deploy and no way to tell a real breakage from the usual noise.
  #
  # `migrate --check` exits non-zero while anything is unapplied AND while the database is
  # unreachable, so one loop covers both. Neither service runs `migrate` itself: three containers
  # migrating the same database concurrently is its own failure.
  # Two workers (CELERY_TASK_ROUTES in config/settings.py). `worker` takes the default "celery"
  # queue — mail, sweeps, everything quick — so none of it waits behind a video encode, and
  # "thumbnails", photo derivatives, by turns with it: a mail waits for one thumbnail, not 400.
  # `worker-media` takes "media": encodes, album ZIP imports and downloads, the hash backfill — the
  # jobs that read whole files, one at a time, because two of them side by side with ffmpeg is what
  # ran this box out of memory.
  worker:
    image: ghcr.io/gahk-org/gahk_intern:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - web
    command: >-
      sh -c "python core/heartbeat_check.py --reset default;
             until python manage.py migrate --check; do echo 'waiting for migrations'; sleep 3; done;
             exec celery -A config worker -Q celery,thumbnails -n default@%h --loglevel=INFO --concurrency=1 --max-memory-per-child=300000"
    # Two processes of about 150 MB each, and Pillow decoding photos for thumbnails.
    mem_limit: 768m
    memswap_limit: 768m
    oom_score_adj: 500
    environment:
      MALLOC_ARENA_MAX: "2"
    # Without a healthcheck, Coolify counts a running container as "unknown", and one unknown
    # container shows the whole app as "Running (unknown)". core/heartbeat_check.py fails when
    # /health would call the process down, on the file core/heartbeat.py touches with every
    # heartbeat row; its argument is the -n before the "@". The --reset above is for restarts,
    # which keep /tmp: the last run's file would pass before this run has beaten. Unhealthy costs
    # only the status here, since Traefik routes to `web` alone. start_period is long because the
    # wait for web's migrations has no bound, and a long one should not read as unhealthy workers.
    healthcheck: &heartbeat-healthcheck
      test: ["CMD", "python", "core/heartbeat_check.py", "default"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s

  worker-media:
    image: ghcr.io/gahk-org/gahk_intern:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - web
    command: >-
      sh -c "python core/heartbeat_check.py --reset media;
             until python manage.py migrate --check; do echo 'waiting for migrations'; sleep 3; done;
             exec celery -A config worker -Q media -n media@%h --loglevel=INFO --concurrency=1 --max-memory-per-child=400000"
    # The limit is the two Celery processes plus ffmpeg, which runs inside this container and so
    # counts towards it. An encode killed here is retried, and the item ends FAILED after its
    # attempts, while the rest of the box keeps running.
    mem_limit: 1536m
    memswap_limit: 1536m
    oom_score_adj: 500
    # An encode takes both vCPUs for hours. cpus keeps half of one free for the site whatever
    # happens; cpu_shares, well under the default of 1024, gives this container a low CPU weight, so
    # the rest of the box goes first when it wants the CPU while the encode still has all of it at
    # night. `nice` would not do this: it ranks processes inside one container, not containers
    # against each other.
    cpus: 1.5
    cpu_shares: 256
    environment:
      MALLOC_ARENA_MAX: "2"
    # As worker's. The heartbeat keeps beating through a 15-minute encode, so a long job is no failure.
    healthcheck:
      <<: *heartbeat-healthcheck
      test: ["CMD", "python", "core/heartbeat_check.py", "media"]

  beat:
    image: ghcr.io/gahk-org/gahk_intern:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - web
    command: >-
      sh -c "python core/heartbeat_check.py --reset beat;
             until python manage.py migrate --check; do echo 'waiting for migrations'; sleep 3; done;
             exec celery -A config beat --loglevel=INFO"
    # One process of about 150 MB; it only sends messages.
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      MALLOC_ARENA_MAX: "2"
    # As worker's.
    healthcheck:
      <<: *heartbeat-healthcheck
      test: ["CMD", "python", "core/heartbeat_check.py", "beat"]

volumes:
  media:
  photo-album-cache:
