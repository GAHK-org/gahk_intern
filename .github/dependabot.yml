version: 2
# Version updates go to dev and ship with the next release, like any other change. Security updates
# ignore target-branch and always open against main (the default branch); they are hotfixes, and
# sync-main-to-dev.yml carries them back to dev.
updates:
  # Python dependencies (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    # Batch routine bumps into one PR each to cut review noise; security fixes
    # still come as their own PRs regardless of grouping.
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
      python-major:
        update-types: ["major"]

  # The frontend bundle (frontend/package.json + package-lock.json): Tailwind, Vite, TypeScript and
  # the browser libraries. Built into the image by the Dockerfile's frontend stage.
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "frontend"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]

  # GitHub Actions used by the workflows in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  # Base images in Dockerfile and Dockerfile.dev (node, python, and uv, which is a FROM stage so
  # that Dependabot sees it).
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "infra"]

  # MediaWiki base image (wiki-deploy/Dockerfile). Patch releases only: a new MediaWiki minor
  # needs update.php and REL branches of our skins/extensions, so it is a manual upgrade.
  - package-ecosystem: "docker"
    directory: "/wiki-deploy"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "infra"]
    ignore:
      - dependency-name: "mediawiki"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Images of the local dev/ETL services in docker-compose.yml. The ones on :latest have no version
  # to bump. Postgres stays on the major that production (Coolify-managed) and CI run: moving it is
  # a manual upgrade of all three. docker-compose.prod.yml only uses our own image.
  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "infra"]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
