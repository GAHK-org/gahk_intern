name: PR triage

# Auto-labels PRs by which files they touch and assigns the PR to its author.
# pull_request_target runs in the base repo's context, so it has a write token even for
# fork PRs. It only reads .github/labeler.yml from the base branch, so a PR can't tamper
# with the labeling rules — safe because we never check out or run the PR's code here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true # remove a label again if the PR no longer touches matching files

  assign-author:
    runs-on: ubuntu-latest
    # Skip if someone is already assigned (don't override a manual assignment).
    if: github.event.pull_request.assignees[0] == null
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: [context.payload.pull_request.user.login],
            })
