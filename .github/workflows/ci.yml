name: CI

on:
  push:
    branches: [main]
  pull_request:

# Match the production image's interpreter (Django 5.2's supported range), not the dev .python-version.
env:
  UV_PYTHON: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run bandit -q -r . -x ./tests,./core/management  # skip tests + one-off ETL scripts

  typecheck:
    runs-on: ubuntu-latest
    # Runs from the repo root (not app/): the [tool.mypy] config lives in pyproject.toml and the
    # django-stubs plugin only imports config.settings (which has safe defaults) — no DB needed.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv run mypy app

  migrations:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    # Catches a model change whose migration was never generated. Cheap, and the only guard on
    # hand-written migrations (SeparateDatabaseAndState, AlterModelTable): a state-only migration
    # looks perfect against pytest's --reuse-db cache, so nothing else would notice a mismatch.
    # No DB needed — makemigrations only compares the models to the migration graph.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-secret
          VISIT_COUNTER_HMAC_KEY: ci

  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: gahk, POSTGRES_USER: gahk, POSTGRES_PASSWORD: gahk }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gahk" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://gahk:gahk@localhost:5432/gahk
      DJANGO_DEBUG: "1"          # plain static storage → no manifest needed for tests
      DJANGO_SECRET_KEY: ci-secret
      VISIT_COUNTER_HMAC_KEY: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv run python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Audit the locked prod dependencies (exported from uv.lock, no requirements file committed).
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/req.txt
      - run: uvx pip-audit -r /tmp/req.txt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t gahk:ci .       # verifies the multi-stage image builds (no push)
