name: Dependabot auto-merge

# Auto-merge patch-level Dependabot PRs once CI passes; leave minor/major for manual review.
# "Once CI passes" is enforced by branch protection: --auto only merges after all required
# status checks are green. Without required checks configured, --auto would merge immediately.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Only patch bumps auto-merge. minor/major fall through and wait for a human.
      - name: Enable auto-merge for patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
