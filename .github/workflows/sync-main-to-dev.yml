name: Sync main to dev

on:
  push:
    branches: [main]

# The workflow only updates the integration branch. A conflict makes the merge fail visibly instead
# of overwriting dev; resolve it in a normal pull request.
#
# It prepares the merge but does NOT open the pull request: the organisation forbids Actions from
# creating or approving one (409 "The organization does not allow GitHub Actions to create or
# approve pull requests"), and the repo-level toggle cannot override that. Automating it would mean
# a PAT or App token, which is a long-lived credential for a link somebody clicks a few times a
# year. So the job prints the compare link instead, and `pull-requests: write` is gone with it.
#
# It also stops when the merge carries nothing. Every dev -> main pull request leaves main holding a
# merge commit dev lacks, so main always reads as "unmerged" even though the files are identical —
# which produced a branch and a 0-file pull request after each release. The tree comparison below is
# the honest test of whether there is anything to carry back; the topology catches up by itself the
# next time there is.
permissions:
  contents: write

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev
          git merge --no-edit origin/main

      # `git diff --quiet` exits 0 when the trees match, i.e. the merge changed no file.
      - name: Does the merge carry anything?
        id: carries
        run: |
          if git diff --quiet origin/dev HEAD; then
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "\`main\` brings no file changes to \`dev\` — nothing to sync." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "result=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push synchronization branch
        id: branch
        if: steps.carries.outputs.result == 'true'
        run: |
          branch="automation/sync-main-${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${branch}"
          echo "name=${branch}" >> "$GITHUB_OUTPUT"

      - name: Link the pull request to open
        if: steps.carries.outputs.result == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/dev...${BRANCH}?expand=1"
          {
            echo "### Sync main into dev"
            echo
            echo "Branch \`${BRANCH}\` holds the merge of \`main\` into \`dev\`."
            echo "Actions may not open the pull request here, so open it by hand:"
            echo
            echo "[Open the pull request](${url})"
          } >> "$GITHUB_STEP_SUMMARY"
