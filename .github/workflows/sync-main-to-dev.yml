name: Sync main to dev

on:
  push:
    branches: [main]

# The workflow only updates the integration branch. A conflict makes the merge fail visibly instead
# of overwriting dev; resolve it in a normal pull request.
#
# It pushes the merge as a branch and opens the pull request into dev itself, as github-actions[bot].
# That needs the organisation's "Allow GitHub Actions to create and approve pull requests". It also
# makes the bot the author, so the person who merged into main can approve it; a pull request they
# opened themselves would need somebody else.
#
# GitHub starts no workflow runs for a pull request that GITHUB_TOKEN opened, with one exception:
# the `pull_request` runs (CI) are created waiting for "Approve workflows to run" in the merge box.
# branch-policy.yml runs on `pull_request_target`, which the exception does not name, so this job
# dispatches it once the pull request exists (workflow_dispatch always starts a run); the required
# branch-flow and in-sync statuses would otherwise never appear. Dispatching rather than running the
# script here keeps the run in branch-policy's queue, so it cannot post a verdict older than one
# another run has already posted. A human still approves and merges: a bypass for GitHub
# Actions on dev would let any branch's own workflow push to dev. Their merge is an ordinary push,
# so branch-policy re-judges the other pull requests into dev as usual.
#
# It also stops when the merge carries nothing. Every dev -> main pull request leaves main holding a
# merge commit dev lacks, so main always reads as "unmerged" even though the files are identical —
# which produced a branch and a 0-file pull request after each release. The tree comparison below is
# the honest test of whether there is anything to carry back; the topology catches up by itself the
# next time there is.
permissions:
  contents: write
  pull-requests: write
  actions: write  # dispatch branch-policy.yml

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev
          git merge --no-edit origin/main

      # `git diff --quiet` exits 0 when the trees match, i.e. the merge changed no file.
      - name: Does the merge carry anything?
        id: carries
        run: |
          if git diff --quiet origin/dev HEAD; then
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "\`main\` brings no file changes to \`dev\` — nothing to sync." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "result=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push synchronization branch
        id: branch
        if: steps.carries.outputs.result == 'true'
        run: |
          branch="automation/sync-main-${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${branch}"
          echo "name=${branch}" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        id: pr
        if: steps.carries.outputs.result == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=${MESSAGE%%$'\n'*}
          short=${GITHUB_SHA::8}
          body=$(cat <<EOF
          Merges \`main\` into \`dev\`, so \`dev\` gets ${short} ("${subject}") and anything else that reached \`main\` without passing through \`dev\`.

          1. Click **Approve workflows to run** in the merge box, so CI runs.
          2. Approve the pull request.
          3. Merge with **Create a merge commit** – never squash.

          Until this is merged, \`in-sync\` blocks every other pull request into \`dev\`.

          Opened by [Sync main to dev](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          EOF
          )
          url=$(gh pr create --base dev --head "$BRANCH" --title "Sync main into dev (${short})" --body "$body")
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "### Sync main into dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Opened ${url}" >> "$GITHUB_STEP_SUMMARY"
          # Ask whoever merged into main to review. A bot, or anything else GitHub refuses, must not
          # fail the sync: the pull request exists either way.
          gh api --silent "repos/${GITHUB_REPOSITORY}/pulls/${url##*/}/requested_reviewers" \
            -f "reviewers[]=${GITHUB_ACTOR}" ||
            echo "::warning::Could not request a review from ${GITHUB_ACTOR}"

      # The new pull request has everything the older ones have, so close them rather than leave
      # two sync pull requests waiting for review.
      - name: Close superseded sync pull requests
        if: steps.carries.outputs.result == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          gh pr list --base dev --state open --limit 200 --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"automation/sync-main-\")) | select(.headRefName != \"${BRANCH}\") | .number" |
            while read -r number; do
              gh pr close "$number" --delete-branch --comment "Superseded by ${URL}."
            done

      # See the comment at the top: nothing else posts branch-flow and in-sync on this pull request.
      - name: Judge the pull request
        if: steps.carries.outputs.result == 'true'
        run: gh workflow run branch-policy.yml --ref main
