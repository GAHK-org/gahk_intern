name: Bug report
description: Something in the GAHK site is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in what you can — even a partial report helps.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
      placeholder: When I open /intern/ the calendar is blank, but it should show events.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as a resident
        2. Go to /intern/
        3. See ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app is affected?
      options:
        - "residents (alumneliste / dashboard)"
        - "admissions (optagelse)"
        - "den_hurtige (chat / posts)"
        - "ak"
        - "oelkaelder"
        - "rooms (vaerelsestjek / soegvaerelse)"
        - "cms (public pages / news)"
        - "stats"
        - "auth / login"
        - "infra / deploy"
        - "other / not sure"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: Where did you see this? (prod gahk.dk, local dev, which browser, logged in as which role)
      placeholder: prod gahk.dk, Chrome, logged in as beboer

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any error output or attach screenshots. Redact secrets first.
      render: shell
