# MediaWiki's short URLs for wiki.gahk.dk (https://www.mediawiki.org/wiki/Manual:Short_URL/Apache):
# pages at /wiki/<title> and the main page at /, both handled by index.php, which reads the title
# from the request path ($wgArticlePath = "/wiki/$1" in LocalSettings.php).
#
# Replaces the base image's short-url.conf (disabled in the Dockerfile), which sent every missing
# file to index.php: a typo or a stale /favicon.ico got the main page with 200 rather than a 404.
#
# In the <Directory> rather than server-wide: rules outside a <VirtualHost> do not reach the default
# vhost. AllowOverride All for /var/www/ comes from the base image's docker-php.conf, which keeps
# MediaWiki's own .htaccess files (no PHP under images/, no access to includes/, maintenance/, …).
<Directory /var/www/html>
    RewriteEngine On
    RewriteRule ^/?wiki(/.*)?$ %{DOCUMENT_ROOT}/index.php [L]
    RewriteRule ^/*$ %{DOCUMENT_ROOT}/index.php [L]
</Directory>
