# Local dev + ETL services (02-schema-etl.md §8).
#   - postgres  : the app's own database. `task db:up` starts this (+ mariadb); point DATABASE_URL
#                 at it (see app/.env.example) instead of the SQLite fallback.
#   - s3        : SeaweedFS (Apache 2.0), S3-compatible object storage standing in for Hetzner Object
#                 Storage in dev — the S3_* settings point at it (core/storage.py). Its S3 API is
#                 published on :9000; the filer's file browser (bucket contents) is on :8888.
#   - s3-init   : one-shot job that creates the dev bucket; runs once and exits, harmless to re-run.
#   - mariadb   : staging copy of the legacy dump (gahk_dk.sql auto-loaded on first init), ETL only.
#   - pgloader  : one-shot MySQL->Postgres bulk lift (run via `docker compose run --rm pgloader ...`)
#   - web       : optional — the Django app itself, hot-reloading. Opt in with the "docker" profile:
#                 `task dev` / `docker compose --profile docker up -d web`. Running `task dev:local`
#                 instead (directly on the host, against the same postgres/s3) remains fully
#                 supported; this service is an alternative, not a replacement.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gahk
      POSTGRES_USER: gahk
      POSTGRES_PASSWORD: gahk
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gahk"]
      interval: 5s
      timeout: 5s
      retries: 20

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: gahk_dk
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: gahk
      MARIADB_PASSWORD: gahk
    ports: ["3306:3306"]
    command: ["--max-allowed-packet=256M"]
    volumes:
      - "mariadbdata:/var/lib/mysql"
      - "./gahk_dk.sql:/docker-entrypoint-initdb.d/01-gahk_dk.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  pgloader:
    image: dimitri/pgloader:latest
    profiles: ["etl"]
    depends_on:
      postgres: {condition: service_healthy}
      mariadb: {condition: service_healthy}
    entrypoint: ["sleep", "infinity"]   # kept idle; run pgloader manually inside it

  s3:
    image: chrislusf/seaweedfs:latest
    # master + volume + filer + S3 gateway in one process; data lives under /data.
    command: ["server", "-s3", "-s3.port=8333", "-filer", "-dir=/data"]
    environment:
      # SeaweedFS's S3 gateway reads its single access key from these. Local dev only, so a fixed
      # throwaway pair rather than anything to rotate; keep in sync with config/settings.py.
      AWS_ACCESS_KEY_ID: gahkdev
      AWS_SECRET_ACCESS_KEY: gahkdevsecret
    ports:
      - "9000:8333"             # S3 API — matches S3_ENDPOINT_URL in app/.env.example
      - "127.0.0.1:8888:8888"   # filer web UI (http://localhost:8888/buckets/) — unauthenticated
    volumes: ["s3data:/data"]
    healthcheck:
      # Anonymous requests get a 403, which still proves the S3 gateway is up (curl exits 0 on it).
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the dev bucket, then exits. head-bucket first makes re-runs (e.g. every `docker compose
  # up`) a no-op rather than an error.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: gahkdev
      AWS_SECRET_ACCESS_KEY: gahkdevsecret
      AWS_DEFAULT_REGION: fsn1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    entrypoint: >
      sh -c "
      aws --endpoint-url http://s3:8333 s3api head-bucket --bucket gahk-s3 2>/dev/null ||
      aws --endpoint-url http://s3:8333 s3api create-bucket --bucket gahk-s3
      "

  # Optional: the Django app itself, hot-reloading (opt-in — see the `services:` comment above).
  # ./app is bind-mounted over the image's copy, so edits on the host are picked up by uvicorn's
  # --reload without a rebuild; only changing pyproject.toml/uv.lock needs one.
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["docker"]
    env_file:
      - path: "app/.env"
        required: false   # falls back to config/settings.py's dev defaults if it doesn't exist yet
    environment:
      # Override the host-oriented values from app/.env with the ones reachable on the compose
      # network — everything else (SECRET_KEY, SMTP, VAPID, ...) still comes from the env file.
      DATABASE_URL: postgres://gahk:gahk@postgres:5432/gahk
      S3_BUCKET: gahk-s3
      S3_ACCESS_KEY: gahkdev
      S3_SECRET_KEY: gahkdevsecret
      S3_ENDPOINT_URL: http://s3:8333
      # The browser following a presigned URL runs on the HOST, not on the compose network, so it
      # cannot resolve "s3" at all — only the published port. Signing with the wrong host
      # 403s the request (SigV4 signs the Host header); see core.storage.PublicEndpointS3Storage.
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ADDRESSING_STYLE: path
      # See app/.env.example: required alongside a non-AWS S3 endpoint (Hetzner AND S3-compatible
      # dev servers need this — botocore's default checksum framing is mis-stored/rejected by them).
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # As in production (docker-compose.prod.yml): thumbnails and HD images are served from a
      # local copy rather than redirected to the bucket. Only `web` serves them, so only it has one.
      PHOTO_ALBUM_CACHE_DIR: /app/cache
    volumes:
      - "./app:/src/app"
      - photo-album-cache:/app/cache
    ports:
      - "8800:8000"
    depends_on:
      postgres: {condition: service_healthy}
      s3-init: {condition: service_completed_successfully}
    # The production server (Dockerfile), reloading, after the system checks runserver used to run.
    # Static files come from WhiteNoise, which finds them in the app directories while DEBUG is on.
    command:
      - sh
      - -c
      - python manage.py check && exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --lifespan off --reload --reload-include '*.html'

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["docker"]
    env_file:
      - path: "app/.env"
        required: false
    environment:
      DATABASE_URL: postgres://gahk:gahk@postgres:5432/gahk
      S3_ENDPOINT_URL: http://s3:8333
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ADDRESSING_STYLE: path
    volumes: ["./app:/src/app"]
    depends_on:
      postgres: {condition: service_healthy}
      s3-init: {condition: service_completed_successfully}
    # Both queues in one worker locally; production runs one worker per queue (docker-compose.prod.yml).
    command: ["celery", "-A", "config", "worker", "-Q", "celery,media", "--loglevel=INFO", "--concurrency=2"]

  beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["docker"]
    env_file:
      - path: "app/.env"
        required: false
    environment:
      DATABASE_URL: postgres://gahk:gahk@postgres:5432/gahk
      S3_ENDPOINT_URL: http://s3:8333
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ADDRESSING_STYLE: path
    volumes: ["./app:/src/app"]
    depends_on:
      postgres: {condition: service_healthy}
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]

volumes:
  pgdata:
  mariadbdata:
  s3data:
  photo-album-cache:
